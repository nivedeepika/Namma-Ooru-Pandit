<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <div>
            <h2>User Resister</h2>
        </div>
        <div>
            <p>Email *</p>
            <input type="email" required id="email">
        </div>
        <div>
            <p>Password *</p>
            <input type="password" required id="password">
        </div>
        <div>
            <p id="code">Code: </p>
            <input type="password" required placeholder="Enter The Code.." id="entercode">
        </div>
        <div>
            <button id="submitBtn">Register</button>
        </div>
        <div>
            <p>I already have an account/ <a href="login.html">login with exist account</a></p>
        </div>
    </form>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import { getDatabase, set, ref } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


        
        const firebaseConfig = {
        apiKey: "AIzaSyDKfu0LYNgX45TgDpwpLxe2yTLY1pTIxRs",
        authDomain: "nammaoorupandit.firebaseapp.com",
        projectId: "nammaoorupandit",
        storageBucket: "nammaoorupandit.firebasestorage.app",
        messagingSenderId: "859981024527",
        appId: "1:859981024527:web:ecff1b476d31a3405c827a",
        measurementId: "G-LXFF0D144X",
        databaseURL:"https://nammaoorupandit-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const dataBase = getDatabase();
        const auth = getAuth();

        function generateCode() {
            var num = Math.round(Math.random() * 10);
            let str = `${num}${num * 2}${num + 3}`;
            document.getElementById('code').textContent = str;
        }
        generateCode();

        document.getElementById('submitBtn').addEventListener("click", (e) => {

            e.preventDefault();

            var code = document.getElementById('entercode').value;
            var orgCode= document.getElementById('code').textContent;
            if (code !== orgCode) {
                alert("Give correct code.");
                return;
            }
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            console.log(email+" "+password)
            register(email, password);
                
        });

        function register(email, password){
            createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        const user = userCredential.user;
                        console.log(user.uid);
                        set(ref(dataBase, `users/${user.uid}`),{
                            email:email,
                            password:password
                        }).then(()=>{
                            alert("Registration successful");
                            localStorage.setItem('uId', user.uid);
                            window.location.href="index.html";
                        }).catch((error)=>{
                            alert(error);
                        });
                    })
                    .catch((error) => {
                        const errorCode = error.code;
                        const errorMessage = error.message;
                        alert(errorMessage);
                    });    
        }


    </script>
</body>
</html>
