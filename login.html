<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <div>
            <h2>User Login</h2>
        </div>
        <div>
            <p>Email *</p>
            <input type="email" id="mail" required>
        </div>
        <div>
            <p>Password *</p>
            <input type="password" id="pass" required>
        </div>
        <div>
            <button type="submit" id="submitBtn">Login</button>
        </div>
        <div>
            <p>I do not have an account/ <a href="register.html">create a new account</a></p>
        </div>
    </form>
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

        const firebaseConfig = {
        apiKey: "AIzaSyDKfu0LYNgX45TgDpwpLxe2yTLY1pTIxRs",
        authDomain: "nammaoorupandit.firebaseapp.com",
        projectId: "nammaoorupandit",
        storageBucket: "nammaoorupandit.firebasestorage.app",
        messagingSenderId: "859981024527",
        appId: "1:859981024527:web:ecff1b476d31a3405c827a",
        measurementId: "G-LXFF0D144X",
        databaseURL:"https://nammaoorupandit-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('submitBtn').addEventListener("click", (e) => {
            e.preventDefault();
            let email = document.getElementById('mail').value;
            let password = document.getElementById('pass').value;
            if(email=="" && password==""){
                alert('Fill the required information');
                return;
            }
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    alert('Login Successful.');
                    localStorage.setItem('uId', user.uid);
                    window.location.href="index.html";
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    alert(errorMessage);
                });
        });
    </script>
</body>
</html>
